<!DOCTYPE html>
<html>
<head>
    <title>Facebook Tracker - Debug Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .info { background: #d1ecf1; }
    </style>
</head>
<body>
    <h1>Facebook Tracker - Extension Test</h1>
    
    <div class="box info">
        <h3>Instructions:</h3>
        <ol>
            <li>Open Facebook in one tab</li>
            <li>Come back here and click "Test Connection"</li>
            <li>Check console (F12) for messages</li>
        </ol>
    </div>

    <button onclick="testConnection()" style="padding: 10px 20px; font-size: 16px;">
        Test Connection to Facebook Tab
    </button>

    <div id="result" style="margin-top: 20px;"></div>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing...</p>';

            try {
                // Get all tabs
                const tabs = await chrome.tabs.query({});
                console.log('Available tabs:', tabs);

                // Find Facebook tab
                const fbTab = tabs.find(t => t.url.includes('facebook.com'));
                
                if (!fbTab) {
                    resultDiv.innerHTML = '<div class="box error"><p>❌ No Facebook tab found. Open Facebook first.</p></div>';
                    return;
                }

                console.log('Found Facebook tab:', fbTab.id);
                
                // Try to send message
                const response = await chrome.tabs.sendMessage(fbTab.id, {
                    type: 'TEST'
                }).catch(err => ({error: err.message}));

                if (response.error) {
                    resultDiv.innerHTML = `<div class="box error"><p>❌ Connection failed: ${response.error}</p><p>The content script may not be loaded. Try refreshing Facebook.</p></div>`;
                } else {
                    resultDiv.innerHTML = '<div class="box success"><p>✅ Connection successful! Extension is working.</p></div>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="box error"><p>❌ Error: ${error.message}</p></div>`;
                console.error('Test error:', error);
            }
        }

        // Log when page loads
        console.log('Test page loaded. Extension should be accessible.');
    </script>
</body>
</html>
